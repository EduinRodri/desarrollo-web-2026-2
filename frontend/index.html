<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Camellapp · Oficios de confianza en Malambo y Barranquilla</title>
    <meta name="description" content="Encuentra plomeros, electricistas, mecánicos y más cerca de ti. Mira reseñas reales, pide el servicio y califícalo al terminar." />
    <meta name="theme-color" content="#A93F1D" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1714" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- La foto del teléfono es el LCP del inicio: se pide en paralelo con el JS en vez de esperar a React.
         Mismos srcset/sizes que el <img> (si no coinciden, se descargaría dos veces). -->
    <link rel="preload" as="image" fetchpriority="high" href="/heroe-telefono-560.webp"
      imagesrcset="/heroe-telefono-320.webp 320w, /heroe-telefono-560.webp 560w" imagesizes="(min-width: 900px) 300px, 240px" />
    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="Camellapp · Oficios de confianza cerca de ti" />
    <meta property="og:description" content="Plomeros, electricistas, mecánicos y más en Malambo y Barranquilla, con reseñas reales." />
    <meta property="og:image" content="/compartir.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
