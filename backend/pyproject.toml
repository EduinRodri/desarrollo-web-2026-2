[project]
name = "camellapp-api"
version = "0.1.0"
description = "API REST de Camellapp (FastAPI + SQLAlchemy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "uvicorn>=0.32"]

[tool.pytest.ini_options]
testpaths = ["tests"]
